# The rolling `nightly` pre-release the device bridge on the Nova tests — see
# docs/PLAN.md section 5 and ADR 0004. Shared by the per-merge publish in
# release.yml and the scheduled one in nightly.yml, so both write the same
# asset names and the bridge cannot tell which one made a build.
#
# Expects, in the workspace: `dist/` with both AppImages and galleon-steam.sh,
# and `device/` with the bundle and build-info.json from
# scripts/device-bundle.mjs. The caller holds `contents: write`, has checked
# the repository out for the tag push, and runs in the `nightly` concurrency
# group, so two publishes never interleave their uploads.
name: Publish the nightly
description: Refresh the nightly pre-release and move its tag last.

runs:
  using: composite
  steps:
    # SHA256SUMS over every asset, which is what the bridge verifies its
    # downloads against before it runs anything.
    - name: Gather the nightly's assets
      shell: bash
      run: |
        mkdir nightly
        cp dist/*.AppImage dist/galleon-steam.sh device/* nightly/
        (cd nightly && sha256sum -- * > SHA256SUMS)
        cat nightly/SHA256SUMS

    - name: Publish the nightly build
      # Pinned to a commit: the caller holds `contents: write`.
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: nightly/*
        tag_name: nightly
        name: Galleon nightly
        body: |
          Built from `main` at ${{ github.sha }}, for the Galleon device
          bridge, which tests it on the test handheld and publishes what it
          found on the `device-results` branch.

          This is not a release and not an update channel: it has passed CI
          and nothing else, and it is replaced by the next build.
        prerelease: true
        make_latest: false
        fail_on_unmatched_files: true

    # Last, as release.yml moves the canary tag: the tag never names a commit
    # whose assets are still uploading. Moved with git because the name is
    # reused on every publish — see the canary job for why the API will not.
    - name: Move the nightly tag
      shell: bash
      run: |
        git tag -f nightly "$GITHUB_SHA"
        git push -f origin refs/tags/nightly
