name: Bug report
description: Something does not work. The agent acts on reports from the repository owner; the owner can also just use Report a problem in the app.
title: '[bug] '
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. Please do **not** paste your RomM server address, tokens or passwords; this page is public.
        On the Nova there is an easier way: Settings -> System -> *Report a problem* saves a cleaned-up report
        that reaches the developer automatically the next night the Nova charges in Game Mode.

  - type: input
    id: build
    attributes:
      label: Build
      description: Shown in the footer and in Settings -> About, e.g. "0.21.0 (a1b2c3d) nightly".
      placeholder: 0.21.0 (a1b2c3d) nightly
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - Signing in / pairing
        - Browsing the library
        - Downloads
        - Starting a game
        - Leaving a game (hold Start)
        - Saves / sync with RomM
        - Steam games
        - Settings
        - Updating / installing
        - Looks wrong / hard to read
        - Slow / stutters
        - Something else
    validations:
      required: true

  - type: dropdown
    id: emulator
    attributes:
      label: Which emulator, if any
      options:
        - None / not about a game
        - RetroArch
        - DuckStation
        - ARMSX2
        - Dolphin
        - PPSSPP
        - Flycast
        - melonDS
        - A Steam game
        - Not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The steps, in order, as you would tell a friend.
      placeholder: |
        1. Opened Browse, picked PSP
        2. Pressed A on a game, then Play
        3. ...
    validations:
      required: true

  - type: textarea
    id: happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often
      options:
        - Every time
        - Sometimes
        - Once so far
    validations:
      required: true

  - type: dropdown
    id: saves
    attributes:
      label: Could a save have been lost or overwritten?
      options:
        - 'No'
        - 'Maybe'
        - 'Yes'
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Attachments
      description: Drop the Report a problem zip here, plus any photos of the screen (with the frame-time overlay for anything about smoothness).
