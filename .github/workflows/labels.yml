# Keeps the repository's labels in step with .github/labels.yml, so the labels
# the agent's rules name (needs-human, agent-working, regression, ...) exist
# wherever the repository does, without anyone creating them by hand.
#
# Creates and updates, never deletes: a label someone added by hand, or one an
# issue still carries after it left the file, is not this workflow's to remove.
name: Labels

on:
  push:
    branches:
      - main
    paths:
      - .github/labels.yml
      - .github/workflows/labels.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          yaml-file: .github/labels.yml
          skip-delete: true
