# Builds the AppImage on every push and pull request, and turns a `v*` tag into
# a GitHub release with the image attached.
#
# One stage now that RomMix is not packaged as a flatpak: electron-builder takes
# the bundle electron-vite produced and writes a single self-contained file.
# There is no runtime to install, no remote to add, and nothing for the release
# page to explain beyond "make it executable and run it".
name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    # One leg per architecture, each on a runner of that architecture:
    # electron-builder packages the Electron binary for the machine it is told
    # to target, and cross-packaging an AppImage means fetching a foreign
    # Electron and an emulated FUSE runtime for no gain when GitHub hosts both.
    # `arm64` is what a Linux handheld that is not x86 actually runs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}
    # The hard limit of the CI time budget (docs/PLAN.md section 4). A leg that
    # reaches it has a hang to find, not a limit to raise.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          # The parent too, for the `changes` step's diff.
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          # The version package.json and the README ask for, so what CI proves
          # is what a contributor is told to install.
          node-version: 24
          cache: npm

      - name: Read the version
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A tag names a version in three places, and only one of them is the tag.
      # Catching a mismatch here costs seconds; catching it after publishing
      # means deleting a release. The changelog entry matters as much as
      # package.json: a release missing from it is a release nobody can read
      # about.
      - name: Check the tag against package.json and the changelog
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          # Through the environment rather than spliced into the script, which
          # GitHub does before the shell ever parses it.
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$VERSION"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          if ! grep -qE "^## $version( |$)" CHANGELOG.md; then
            echo "::error::no '## $version' section in CHANGELOG.md"
            exit 1
          fi

      # What packaging downloads, kept between runs: Electron's archive and the
      # AppImage toolset. Keyed on the lockfile, which is what names the
      # Electron and electron-builder versions both depend on.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: package-cache-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      # Which slow work this change needs (docs/PLAN.md section 4). A pull
      # request is checked out as a merge commit and main moves by squash
      # merges, so the first parent is the base in both cases. Docker RomM 5.2.0
      # runs once, on x64, when client, save or fixture code changed; a manual
      # dispatch runs every version on both architectures. Packaging is left out
      # only for a pull request that changes nothing but prose: a push to main
      # always packages, because the canary job publishes what it made.
      - name: changes
        id: changes
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"
          romm=false
          if grep -qE '^(src/main/romm/|src/main/saves[^/]*\.ts$|src/main/saves-compat/|test/romm/|test/fixtures/|schema/)' <<<"$changed"; then
            romm=true
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            profiles='v520 v531'
          elif [ "$ARCH" = x64 ] && [ "$romm" = true ]; then
            profiles=v520
          else
            profiles=
          fi
          docs_only=false
          if [ -n "$changed" ] && ! grep -qvE '(\.md$|^docs/|^\.github/ISSUE_TEMPLATE/)' <<<"$changed"; then
            docs_only=true
          fi
          package=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$docs_only" = true ]; then
            package=false
          fi
          echo "romm=$romm" >>"$GITHUB_OUTPUT"
          echo "docs_only=$docs_only" >>"$GITHUB_OUTPUT"
          echo "package=$package" >>"$GITHUB_OUTPUT"
          echo "romm_profiles=$profiles" >>"$GITHUB_OUTPUT"

      # The same gates `.release-it.js` runs before it will cut a tag, repeated
      # here because a pull request never goes through release-it. Once, on x64:
      # the code they read is the same on either architecture, and the arm64
      # leg's job is to prove the package for the device (PLAN.md section 4).
      # Coverage runs every unit test once and holds them to the floors in
      # package.json, so it stands in for `npm test`.
      - if: matrix.arch == 'x64'
        run: npm run format:check
      - if: matrix.arch == 'x64'
        run: npm run lint
      - if: matrix.arch == 'x64'
        run: npm run typecheck
      - if: matrix.arch == 'x64'
        run: npm run test:coverage

      # The guard on the feature list the project is accepted against — see
      # scripts/agent/features-check.mjs. On a pull request it also compares the
      # list with the base branch's, which a shallow checkout has not fetched,
      # and holds the pull request to a PROGRESS.md entry of its own, written in
      # the session that opened it or since (M0-18).
      # Once is enough: the list is the same on either architecture.
      - name: Check the feature list
        if: matrix.arch == 'x64'
        env:
          BASE_REF: ${{ github.base_ref }}
          OPENED: ${{ github.event.pull_request.created_at }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            node scripts/agent/features-check.mjs --base "origin/$BASE_REF" --opened "$OPENED" --author "$AUTHOR"
          else
            node scripts/agent/features-check.mjs
          fi

      # The program that runs on the Nova and tests every nightly — see
      # tools/device-bridge/README.md. Python's standard library only, so the
      # runner's interpreter is enough.
      - name: Device bridge tests
        if: matrix.arch == 'x64'
        run: python3 -m unittest discover -s tools/device-bridge

      # Every pull request names the feature it serves, so the change can be
      # held to its acceptance lines — see scripts/agent/pr-body.mjs. The body
      # comes through the environment rather than spliced into the script,
      # which GitHub does before the shell ever parses it. Editing a body does
      # not start a run, and a re-run reads the body the run started with, so
      # a body fixed after a red check is proved by the next push.
      - name: Check the pull-request body
        if: matrix.arch == 'x64' && github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node scripts/agent/pr-body.mjs

      # What ships inside the AppImage stays MIT-compatible: every runtime
      # dependency recorded in docs/DEPENDENCIES.md, no GPL-family licence in
      # the production tree, and no text copied from the GPL projects read as
      # specification — see scripts/agent/licence-guard.mjs.
      - name: Licence and dependency guard
        if: matrix.arch == 'x64'
        run: node scripts/agent/licence-guard.mjs

      # A disposable RomM per version, provisioned through its own API, then
      # the suites that need a real server — see test/romm/README.md.
      - name: Docker RomM
        if: steps.changes.outputs.romm_profiles != ''
        env:
          PROFILES: ${{ steps.changes.outputs.romm_profiles }}
        run: |
          args=()
          for profile in $PROFILES; do args+=(--profile "$profile"); done
          npm run test:romm -- "${args[@]}"

      # `npm run appimage` is these two together; they are split so that a
      # failing bundle and a failing package are separate red steps. The
      # `--publish never` that matters lives in the `package` script, so it
      # cannot be forgotten here — see package.json.
      - run: npm run build

      # Everything the package step would otherwise fetch from github.com in
      # the middle of packaging, fetched here with a few attempts instead —
      # see scripts/warm-package-cache.mjs. The packaging below is never
      # retried, so a network hiccup is better met here, before it starts.
      - name: Warm the packaging cache
        id: warm
        if: steps.changes.outputs.package == 'true'
        run: node scripts/warm-package-cache.mjs ${{ matrix.arch }}

      # Handed the archive the step above checked, so it fetches nothing.
      - if: steps.changes.outputs.package == 'true'
        run: npm run package -- --${{ matrix.arch }} -c.electronDist="$ELECTRON_ZIP"
        env:
          ELECTRON_ZIP: ${{ steps.warm.outputs.electron-zip }}

      # The one check that runs the renderer, the IPC wiring and the preload
      # bridge together — see test/app/. It needs somewhere to put a window,
      # which a runner has not got; xvfb is the whole of what that takes.
      #
      # The screen is stated rather than left to xvfb's default, which is too
      # small: RomMix is drawn for a 1080p television, and on a smaller one the
      # library's games sit below the fold where nothing can reach them.
      #
      # After the package step rather than beside the other four: it drives the
      # bundle in `out/`, so it is only worth running once there is one that
      # built.
      # `npm ci` does not fetch Electron's binary — the package no longer does it
      # on install, which is why CONTRIBUTING has it as a separate line too. The
      # AppImage above is unaffected: it is packaged from the archive the
      # warm-up step fetched. Only something that actually *runs* Electron
      # needs this, and until now nothing in CI did.
      - run: npx install-electron

      # Chromium will not run without its sandbox, and the helper npm unpacks is
      # owned by the build user with no setuid bit — so Electron finds it,
      # refuses to start unsandboxed, and aborts. This is the fix rather than
      # passing `--no-sandbox`: the tests then drive the application the way it
      # actually runs for people, and a runner where this cannot be done is a
      # runner where `--no-sandbox` is the local answer rather than a change to
      # what is under test.
      - run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      # The runner has no screen. Installed rather than wrapped around the
      # command: `npm run test:app` finds Xvfb for itself and asks it for the
      # size the suite needs — see scripts/test-app.sh — so this job runs the
      # same line a contributor does.
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - if: matrix.arch == 'x64'
        run: npm run test:app

      # The arm64 leg proves the image the Nova gets rather than the code, which
      # x64 has just driven: the AppImage's own tree starts, reaches Home against
      # the fake server and quits — see test/app/smoke.ts. Extracted first so
      # its Chromium sandbox helper can be made setuid root, the same fix as
      # the one above for the development Electron.
      - name: Smoke-test the package
        if: matrix.arch == 'arm64' && steps.changes.outputs.package == 'true'
        run: |
          work=$(mktemp -d)
          (cd "$work" && "$GITHUB_WORKSPACE/dist/Galleon-arm64.AppImage" --appimage-extract >/dev/null)
          sudo chown root:root "$work/squashfs-root/chrome-sandbox"
          sudo chmod 4755 "$work/squashfs-root/chrome-sandbox"
          GALLEON_APPIMAGE="$work/squashfs-root/AppRun" npm run smoke:app

      # Every screen a pull request touches, at the Nova's 1280x960, for the
      # agent and the evaluator to look at — see test/app/shots.ts. Once, on
      # x64: the pictures are the same on both legs, and the full set is the
      # nightly's (PLAN.md section 4).
      - if: matrix.arch == 'x64'
        run: npm run shots:nova -- --subset pr

      # Kept whether or not the step passed: the sheet says which screen
      # failed, and the pictures of the rest are the evidence a PR quotes.
      - uses: actions/upload-artifact@v7
        if: always() && matrix.arch == 'x64'
        with:
          name: shots-x64
          path: artifacts/shots/
          if-no-files-found: ignore

      # The one suite whose failures cannot be read from a log: it drives a
      # window, and the message says what was waited for rather than what was
      # drawn. The driver leaves a screenshot behind wherever it gives up — see
      # `capture` in test/app/driver.ts — and this is what carries it off a
      # runner that is about to be deleted. Only on failure, because a passing
      # run leaves nothing there.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: app-test-failures-${{ matrix.arch }}
          path: test/app/failures/
          if-no-files-found: ignore

      # The device test bundle and the build-info.json naming this commit,
      # which the `nightly` publish below carries to the Nova — see
      # scripts/device-bundle.mjs. Built on every x64 leg, pull requests too,
      # so a bundle that cannot be built is red before it is merged; kept only
      # from main, the one place it is published from.
      - name: Build the device test bundle
        if: matrix.arch == 'x64'
        run: node scripts/device-bundle.mjs --sha "$GITHUB_SHA" --out device
      - uses: actions/upload-artifact@v7
        if: matrix.arch == 'x64' && github.ref == 'refs/heads/main'
        with:
          name: device-bundle
          path: device/
          if-no-files-found: error

      # Shipped beside the image, not inside it: it is what Steam's shortcut
      # points at, and the AppImage cannot set the variable that makes itself
      # launchable from Steam. Shipped under the product's name; see
      # packaging/rommix-steam.sh.
      - if: steps.changes.outputs.package == 'true'
        run: cp packaging/rommix-steam.sh dist/galleon-steam.sh

      # Named per leg: two jobs uploading one name is an error, and the release
      # job merges them back with a pattern.
      - uses: actions/upload-artifact@v7
        if: steps.changes.outputs.package == 'true'
        with:
          name: appimage-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/galleon-steam.sh
          if-no-files-found: error

  # The tip of main, attached to one rolling pre-release so that a copy running
  # with ROMMIX_CANARY set has somewhere to fetch it from — see `CANARY_API` in
  # src/main/update.ts. The images are the build job's, unchanged: a channel
  # that packaged its own would be testing something nobody is going to be sent.
  #
  # Not a release. It has been through the four gates above and nothing else,
  # and is published as a pre-release with `make_latest` off so that neither
  # `/releases/latest` nor somebody who volunteered for release candidates can
  # be handed one.
  canary:
    needs: build
    # Main, however this run was started — a push or a hand-started one, both
    # of which publish the tip of the branch, which is what the channel is. Not
    # a pull request, which builds the same images from something nobody has
    # merged, and not a tag, which the release job below answers for.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # The group nightly.yml runs in, because the `nightly` publish at the end of
    # this job writes the same release: two publishes interleaving their
    # uploads would leave assets from different commits under one tag. Never
    # cancelled, so a publish that has started always finishes.
    concurrency:
      group: nightly
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      # For the tags moved in this job.
      - uses: actions/checkout@v7

      # Both legs, exactly as the release job takes them.
      - uses: actions/download-artifact@v8
        with:
          pattern: appimage-*
          merge-multiple: true
          path: dist

      # Over every file the release carries, in the format `sha256sum -c`
      # reads, so a person can check a download by hand and the updater holds
      # an image to what CI built — see `Updater.publishedDigest`.
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum *.AppImage galleon-steam.sh > SHA256SUMS

      - name: Publish the canary build
        # Pinned for the same reason the release job pins it: the job holds
        # `contents: write`.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.AppImage
            dist/galleon-steam.sh
            dist/SHA256SUMS
          tag_name: canary
          name: Galleon canary
          # Shown and not read: the commit a copy on this channel compares
          # itself against comes from the tag. This is what the release page
          # says to whoever is looking at it, which is what the channel is
          # rather than what changed — the commit log is a click away and a
          # television is not where it is read.
          body: |
            Built from the tip of `main`, at ${{ github.sha }}.

            This is not a release. It has passed CI and nothing else, and it is
            replaced by the next commit. `ROMMIX_CANARY=1` is what asks for it.
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true

      # Last, and that is the whole of what makes the channel safe to read. A
      # copy on it compares itself against the commit this tag names — see
      # `CANARY_COMMIT_API` in src/main/update.ts — so a tag moved before the
      # step above names a build whose images are still uploading. Every copy
      # would fetch the previous ones, verify them against the digest those
      # images really have, and sit on a restart that changed nothing.
      #
      # Moved with git rather than asked for from the API, because GitHub uses
      # `target_commitish` only where the tag does not already exist and this
      # name is reused on every push. The step above creates it on the first
      # run, at the commit this job was started for; from then on this is what
      # moves it.
      - name: Move the canary tag
        run: |
          git tag -f canary "$GITHUB_SHA"
          git push -f origin refs/tags/canary

      # The device-testable build of this merge, for the bridge on the Nova
      # (docs/PLAN.md section 5, ADR 0004): the same images as the canary,
      # plus the device test bundle and build-info.json, under the rolling
      # `nightly` pre-release that nightly.yml also publishes to, with the same
      # asset names, so the bridge picks up every merge unchanged.
      - uses: actions/download-artifact@v8
        with:
          name: device-bundle
          path: device

      # SHA256SUMS over every asset, which is what the bridge verifies its
      # downloads against before it runs anything.
      - name: Gather the nightly's assets
        run: |
          mkdir nightly
          cp dist/*.AppImage dist/galleon-steam.sh device/* nightly/
          (cd nightly && sha256sum -- * > SHA256SUMS)
          cat nightly/SHA256SUMS

      - name: Publish the nightly build
        # Pinned as the canary step above is.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: nightly/*
          tag_name: nightly
          name: Galleon nightly
          body: |
            Built from `main` at ${{ github.sha }}, for the Galleon device
            bridge, which tests it on the test handheld and publishes what it
            found on the `device-results` branch.

            This is not a release and not an update channel: it has passed CI
            and nothing else, and it is replaced by the next build.
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true

      # Last, as for the canary tag above: the tag never names a commit whose
      # assets are still uploading.
      - name: Move the nightly tag
        run: |
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      # For CHANGELOG.md, which is what the release page is written from.
      - uses: actions/checkout@v7

      # Named rather than left to whatever the runner image ships, for the same
      # reason the build job names it.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Both legs into one folder. `galleon-steam.sh` is identical in each, and
      # `merge-multiple` overwrites rather than nesting, so it lands once.
      - uses: actions/download-artifact@v8
        with:
          pattern: appimage-*
          merge-multiple: true
          path: dist

      # Over every file the release carries, in the format `sha256sum -c`
      # reads, so a person can check a download by hand and the updater holds
      # an image to what CI built — see `Updater.publishedDigest`.
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum *.AppImage galleon-steam.sh > SHA256SUMS

      # The section for this version, plus how to run what is attached. The
      # build job has already refused the tag if that section is missing, so
      # this cannot publish a release with nothing to read.
      - name: Write the release notes
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md

      # The notes are RomMix's own — see `scripts/release-notes.mjs` for why
      # they are not GitHub's generated ones. A tag like v0.2.0-rc1 is a
      # pre-release; v0.2.0 is not.
      - name: Publish the release
        # Pinned to a commit rather than a tag: this is the only job holding
        # `contents: write`, and a moving tag is a third party able to use it.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.AppImage
            dist/galleon-steam.sh
            dist/SHA256SUMS
          name: Galleon ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
